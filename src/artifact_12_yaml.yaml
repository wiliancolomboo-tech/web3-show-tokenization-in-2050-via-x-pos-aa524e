version: "3.8"

services:
  helios-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helios-2050-orchestrator
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - HELIOS_PROGRAM_ID=HeLios20501111111111111111111111111111111111
      - ENERGY_MINT_ADDRESS=SoL2050PkWhMint11111111111111111111111111111
      - ENTERPRISE_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - POLL_INTERVAL_MS=10000
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"