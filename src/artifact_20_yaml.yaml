version: '3.8'

services:
  heliostream-oracle-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heliostream_telemetry_daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=HeLioS1111111111111111111111111111111111111
      - ENTERPRISE_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"