[package]
name = "helios_2050"
version = "0.1.0"
description = "Helios-2050: Space Infrastructure & Orbital Energy Tokenization Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "helios_2050"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
solana-program = "1.18.26"
spl-token-2022 = { version = "0.11.0", features = ["no-entrypoint"] }
spl-tlv-account-resolution = "0.1.5"
spl-transfer-hook-interface = "0.6.3"