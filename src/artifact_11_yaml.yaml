version: '3.8'

services:
  helios-telemetry-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_1234567890abcdef
      - RESEND_ALERT_EMAIL=ops@helios50.energy
      - MINT_ADDRESS=HeLioS5011111111111111111111111111111111111
      - ORACLE_SECRET_KEY=[1,2,3...255]
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"