version: '3.8'

services:
  sol2050-groundstation:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=DYSON11111111111111111111111111111111111111
      - AUTHORITY_SECRET_KEY=[1,2,3...]
      - HARDWARE_SECRET_KEY=[4,5,6...]
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_123456789
      - ENTERPRISE_ALERT_EMAIL=ops@sol2050.space
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"